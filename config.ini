[colors]
background = #121b1a
background-alt = #243534
foreground = #D5CDC2
primary = #65988A
secondary = #979785
alert = #9C594A
disabled = #979785
green = #5B8582
yellow = #D5CDC2
orange = #9C594A
red = #9C594A
pink = #9C594A
mauve = #5B8582
lavender = #65988A
blue = #65988A
sky = #65988A
teal = #5B8582
peach = #9C594A

[bar/main]
width = 100%
height = 30
radius = 0
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

border-bottom-size = 2
border-color = ${colors.primary}

padding-left = 1
padding-right = 1
module-margin = 1

font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "JetBrainsMono Nerd Font:size=12;3"
font-2 = "Material Design Icons:size=12;3"

modules-left = i3
modules-center = date
modules-right = filesystem cpu memory network pulseaudio

tray-position = right
tray-padding = 2
tray-background = ${colors.background}

cursor-click = pointer
enable-ipc = true

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false

; Mode display (resize etc)
label-mode-padding = 1
label-mode-foreground = ${colors.background}
label-mode-background = ${colors.primary}

; Active workspace on focused monitor
label-focused = %index%
label-focused-foreground = ${colors.primary}
label-focused-padding = 1

; Inactive workspace on any monitor
label-unfocused = %index%
label-unfocused-padding = 1
label-unfocused-foreground = ${colors.foreground}

; Active workspace on unfocused monitor
label-visible = %index%
label-visible-padding = 1

; Urgent workspace
label-urgent = %index%
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 1

; Workspace icons
ws-icon-0 = 1;
ws-icon-1 = 2;
ws-icon-2 = 3;
ws-icon-3 = 4;
ws-icon-4 = 5;
ws-icon-5 = 6;
ws-icon-6 = 7;
ws-icon-7 = 8;
ws-icon-8 = 9;
ws-icon-9 = 10;
ws-icon-default = 

[module/filesystem]
type = internal/fs
interval = 60
mount-0 = /

format-mounted = <label-mounted>
format-mounted-prefix = " "
format-mounted-prefix-foreground = ${colors.primary}
label-mounted = %percentage_used%

[module/cpu]
type = internal/cpu
interval = 2

format = <label>
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%

[module/memory]
type = internal/memory
interval = 2

format = <label>
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.primary}
label = %percentage_used%

[module/network]
type = internal/network
interface = ${env:DEFAULT_NETWORK_INTERFACE:wlan0}
interval = 3.0

format-connected = <label-connected>
format-connected-prefix = "󰖩 "
format-connected-prefix-foreground = ${colors.primary}
label-connected = Connected

format-disconnected = <label-disconnected>
format-disconnected-prefix = "󰖪 "
format-disconnected-prefix-foreground = ${colors.alert}
label-disconnected = Disconnected
label-disconnected-foreground = ${colors.disabled}

[module/date]
type = internal/date
interval = 1

date = "%b %d"
time = "%H:%M"

format = <label>
format-background = ${colors.background}
format-foreground = ${colors.foreground}
format-padding = 1
label = "%{F#65988A}%{F-} %date% %{F#65988A}|%{F-} %{F#65988A}%{F-} %time%"

[module/pulseaudio]
type = internal/pulseaudio

format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%
label-volume-foreground = ${colors.foreground}
ramp-volume-foreground = ${colors.primary}
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾

format-muted = <label-muted>
format-muted-prefix = "󰖁 "
format-muted-prefix-foreground = ${colors.alert}
label-muted = Muted
label-muted-foreground = ${colors.disabled}

click-right = pavucontrol

[settings]
screenchange-reload = true
pseudo-transparency = false